<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crypto Checker</title>
<meta name="description" content="Crypto Checker – crypto price watchlist, alarms and widgets for Android and iPhone. Privacy policy / Datenschutz.">
<style>
  :root { --bg:#faf7f5; --surface:#fff; --text:#1f2328; --muted:#5d636b; --border:#e7e1dc; --accent:#d2693f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#15171b; --surface:#1d2026; --text:#e8e9eb; --muted:#a1a7b0; --border:#2e323a; --accent:#ef9571; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text);
         font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; padding:24px 16px; }
  .card { max-width:460px; width:100%; background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:28px 24px; text-align:center; }
  .logo { width:72px; height:72px; margin:0 auto 12px; border-radius:18px; background:linear-gradient(135deg,#ee9571,#b04e2d); display:grid; place-items:center; }
  .logo svg { width:44px; height:44px; }
  h1 { margin:0 0 4px; font-size:1.5rem; }
  p { margin:0 0 20px; color:var(--muted); }
  .links { display:grid; gap:10px; }
  .links a { display:block; padding:12px 16px; border-radius:12px; border:1px solid var(--border); color:var(--text); text-decoration:none; font-weight:600; }
  .links a:hover { border-color:var(--accent); color:var(--accent); }
  small { display:block; margin-top:20px; color:var(--muted); }
  small a { color:var(--accent); }
</style>
</head>
<body>
<main class="card">
  <div class="logo" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M9 13l2-2 1.5 1.5L15 10"/><path d="M10.5 20.5a1.6 1.6 0 0 0 3 0"/>
    </svg>
  </div>
  <h1>Crypto Checker</h1>
  <p>Crypto prices, alarms &amp; widgets for Android &amp; iPhone.<br>No account · no ads · no tracking.</p>
  <div class="links">
    <a href="privacy/#de" hreflang="de">Datenschutzerklärung (Deutsch)</a>
    <a href="privacy/#en" hreflang="en">Privacy Policy (English)</a>
  </div>
  <small>Questions &amp; wishes / Fragen &amp; Wünsche: <a href="https://github.com/r1adBE/cryptoChecker/issues/new/choose">GitHub</a> · Contact: <a href="mailto:riad.work@outlook.com">riad.work@outlook.com</a></small>
</main>
</body>
</html>
