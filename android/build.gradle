// Wurzel-Buildskript: hier stehen alle Versionen an einer Stelle.
buildscript {
    ext {
        compile_sdk_version = 37
        target_sdk_version = 36
        min_sdk_version = 26

        agp_version = '9.2.1'
        kotlin_version = '2.3.21'
        ksp_version = '2.3.11'

        core_ktx_version = '1.19.1'
        appcompat_version = '1.8.0'
        coroutine_version = '1.11.0'

        compose_bom_version = '2026.09.00'
        activity_compose_version = '1.13.0'
        lifecycle_version = '2.9.4'
        navigation_version = '2.9.5'

        // Hilt 2.60 setzt AGP 9, Gradle 9.1 und Kotlin 2.3.21 voraus.
        hilt_version = '2.60.1'
        androidx_hilt_version = '1.4.0'

        room_version = '2.8.5'
        work_version = '2.12.0'
        // work-testing 2.12 braucht concurrent-futures 1.2.0, work-runtime nur 1.1.0. AGP gleicht
        // androidTest strikt an die App an — darum hebt die App die Version selbst an.
        concurrent_futures_version = '1.2.0'
        datastore_version = '1.1.7'

        okhttp_version = '5.5.0'
        constraintlayout_compose_version = '1.1.2'

        // App-Sperre (BiometricPrompt mit Geräte-PIN als Ausweg)
        biometric_version = '1.1.0'

        // Instrumentierte Tests (app/src/androidTest, nur ./gradlew connectedDebugAndroidTest)
        androidx_test_version = '1.7.0'
        androidx_test_ext_junit_version = '1.3.0'

        // Startgeschwindigkeit: Baseline Profile (Modul :baselineprofile erzeugt es, siehe
        // DEVELOPMENT.md); profileinstaller installiert es auch ausserhalb des Play Store.
        // Benchmark 1.5 braucht für AGP 9 kein «newDsl=false» mehr.
        benchmark_version = '1.5.0'
        profileinstaller_version = '1.4.1'
        uiautomator_version = '2.3.0'
    }
    // AGP 9 bringt Kotlin eingebaut mit (ohne Plugin org.jetbrains.kotlin.android).
    // Die Kotlin-Version kommt über diesen Klassenpfad; Hilt 2.60 braucht >= 2.3.21.
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

plugins {
    id 'com.android.application' version "$agp_version" apply false
    id 'com.android.library' version "$agp_version" apply false
    id 'com.android.test' version "$agp_version" apply false
    id 'androidx.baselineprofile' version "$benchmark_version" apply false
    id 'org.jetbrains.kotlin.plugin.compose' version "$kotlin_version" apply false
    id 'com.google.devtools.ksp' version "$ksp_version" apply false
    id 'com.google.dagger.hilt.android' version "$hilt_version" apply false
    id 'androidx.room' version "$room_version" apply false
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
