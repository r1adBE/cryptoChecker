# Versionskatalog: alle Versionen, Bibliotheken und Plugins an einer Stelle.
# Zugriff in den Buildskripten über libs.<alias> (Bindestriche werden zu Punkten),
# Versionen über libs.versions.<name>. Dependabot (Ökosystem gradle) liest diese Datei.

[versions]
compileSdk = "37"
targetSdk = "36"
minSdk = "26"

agp = "9.4.1"
kotlin = "2.4.21"
ksp = "2.3.12"

coreKtx = "1.19.1"
# Startbildschirm (installSplashScreen, auch vor Android 12 gleich)
splashscreen = "1.2.0"
appcompat = "1.8.0"
coroutines = "1.11.0"

composeBom = "2026.09.00"
activityCompose = "1.13.0"
lifecycle = "2.9.4"
navigation = "2.10.2"
# Typsichere Routen der Navigation (@Serializable); das Compiler-Plugin hat die Kotlin-Version
serialization = "1.11.0"

# Hilt 2.60 setzt AGP 9, Gradle 9.1 und Kotlin 2.3.21 voraus.
hilt = "2.60.1"
androidxHilt = "1.4.0"

room = "2.8.5"
# Verschlüsselte Datenbanken: SQLCipher mit 16-KB-Seiten (ab 4.6.1); androidx.sqlite kommt über Room
sqlcipher = "4.19.1"
work = "2.12.0"
# work-testing 2.12 braucht concurrent-futures 1.2.0, work-runtime nur 1.1.0. AGP gleicht
# androidTest strikt an die App an — darum hebt die App die Version selbst an.
concurrentFutures = "1.2.0"
datastore = "1.1.7"

okhttp = "5.5.0"
constraintlayoutCompose = "1.1.2"

# App-Sperre (BiometricPrompt mit Geräte-PIN als Ausweg)
biometric = "1.1.0"

timber = "5.0.1"

# Unit- und instrumentierte Tests: Flows Schritt für Schritt prüfen (Turbine). Dazu kotlinx-coroutines-test
# (Version wie coroutines) und mockwebserver3 (Version wie okhttp, ab OkHttp 5 eigener Name).
turbine = "1.2.1"
junit = "4.13.2"
androidJson = "0.0.20131108.vaadin1"
# Wear-OS-App (:wear, Build 154): Compose für Wear OS und Komplikationen
wearCompose = "1.5.0"
wearComplications = "1.2.1"
# Handy ↔ Uhr: nur die Coin-Liste der Uhr (Wear-Daten-Schicht der Google Play-Dienste, Build 154)
playServicesWearable = "19.0.0"
# Testabdeckung (nur Anzeige in CI, keine Schwelle): Kover wird nur mit -Pcoverage=true angewendet, der normale
# Testlauf bleibt ohne Instrumentierung. 0.9.4+ unterstützt AGP 9, 0.9.9+ Gradle 9.6+ ohne Warnung.
kover = "0.9.11"

# Instrumentierte Tests (app/src/androidTest, nur ./gradlew connectedDebugAndroidTest)
androidxTest = "1.7.0"
androidxTestExtJunit = "1.3.0"

# Startgeschwindigkeit: Baseline Profile (Modul :baselineprofile erzeugt es, siehe
# DEVELOPMENT.md); profileinstaller installiert es auch ausserhalb des Play Store.
# Benchmark 1.5 braucht für AGP 9 kein «newDsl=false» mehr.
benchmark = "1.5.0"
profileinstaller = "1.4.1"
uiautomator = "2.4.0"

[libraries]
# AGP 9 bringt Kotlin eingebaut mit (ohne Plugin org.jetbrains.kotlin.android); die Kotlin-Version
# kommt über den Klassenpfad des Wurzel-Buildskripts.
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }

androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "splashscreen" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-android-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
hilt-android-testing = { module = "com.google.dagger:hilt-android-testing", version.ref = "hilt" }

# Compose: Versionen kommen aus der BOM
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-util = { module = "androidx.compose.ui:ui-util" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }

androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-wear-compose-material = { module = "androidx.wear.compose:compose-material", version.ref = "wearCompose" }
androidx-wear-compose-foundation = { module = "androidx.wear.compose:compose-foundation", version.ref = "wearCompose" }
androidx-wear-complications-datasource = { module = "androidx.wear.watchface:watchface-complications-data-source-ktx", version.ref = "wearComplications" }
play-services-wearable = { module = "com.google.android.gms:play-services-wearable", version.ref = "playServicesWearable" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "serialization" }

androidx-hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "androidxHilt" }
androidx-hilt-lifecycle-viewmodel-compose = { module = "androidx.hilt:hilt-lifecycle-viewmodel-compose", version.ref = "androidxHilt" }
androidx-hilt-work = { module = "androidx.hilt:hilt-work", version.ref = "androidxHilt" }
androidx-hilt-compiler = { module = "androidx.hilt:hilt-compiler", version.ref = "androidxHilt" }

androidx-constraintlayout-compose = { module = "androidx.constraintlayout:constraintlayout-compose", version.ref = "constraintlayoutCompose" }

androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
# Migrationstests aus den exportierten Schemas (MigrationTestHelper, nur androidTest)
androidx-room-testing = { module = "androidx.room:room-testing", version.ref = "room" }
# Nur als AAR ohne Abhängigkeiten eingebunden (siehe app/build.gradle.kts)
sqlcipher-android = { module = "net.zetetic:sqlcipher-android", version.ref = "sqlcipher" }

okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging-interceptor = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
okhttp-mockwebserver3 = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }

androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
androidx-work-testing = { module = "androidx.work:work-testing", version.ref = "work" }
androidx-concurrent-futures = { module = "androidx.concurrent:concurrent-futures", version.ref = "concurrentFutures" }
androidx-concurrent-futures-ktx = { module = "androidx.concurrent:concurrent-futures-ktx", version.ref = "concurrentFutures" }

androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "biometric" }
timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileinstaller" }

junit = { module = "junit:junit", version.ref = "junit" }
android-json = { module = "com.vaadin.external.google:android-json", version.ref = "androidJson" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }

androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTest" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
androidx-test-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }
androidx-benchmark-macro-junit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "benchmark" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
baselineprofile = { id = "androidx.baselineprofile", version.ref = "benchmark" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
room = { id = "androidx.room", version.ref = "room" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
