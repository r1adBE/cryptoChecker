# Projektweite Gradle-Einstellungen.
# Einstellungen aus der IDE überschreiben diese Datei.

org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Konfiguration zwischenspeichern (spart ein paar Sekunden pro Build)
org.gradle.configuration-cache=true

# Nur Warnungen zusammengefasst ausgeben
org.gradle.warning.mode=summary

android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true

kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
# AGP 9 baut Unit-Tests standardmässig nur für den getesteten Build-Typ (debug); die CI prüft auf main zusätzlich
# testReleaseUnitTest (Quellsatz src/withoutHttpLog des Store-Builds). Ohne diese Zeile fehlt die Aufgabe (Build 133).
android.onlyEnableUnitTestForTheTestedBuildType=false
