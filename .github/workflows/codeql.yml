# CodeQL code scanning (advanced setup; replaces GitHub's default setup). Why not the default setup: its autobuild
# runs «gradlew assemble» for every variant under the CodeQL tracer, which ran out of memory on the hosted runner
# (red in 3 of 7 runs), and it switches Gradle's dependency verification off. Here Kotlin/Java is built by hand:
# one variant (debug) of :app (with :marketdata, :domain, :data) and :wear, compile only, verification and
# lock files on. Swift is built by hand as well (simulator, one architecture, whole module without optimisation, scheme of ios.yml –
# CodeQL's autobuild made a Release build of every target and needed about an hour); Python and the workflows need
# no build. Results: Security › Code scanning. Requires «CodeQL analysis: Advanced» in the repository settings –
# while the default setup is on, GitHub rejects the uploads of this workflow.
# Pull requests analyse only the languages whose files they change (job «changes», git diff against the base
# branch); a pull request without such files (documents, translations, test data) starts no analysis. Pushes to
# main, the weekly run and manual runs always analyse all four languages.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 5 * * 3'   # Wednesdays 05:17 UTC (kept enabled by keepalive.yml)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The languages to analyse as the matrix of the job below. Pull requests: plain git diff between the merge commit
  # and its first parent (the base branch), no third-party action; the file names are only compared with fixed
  # patterns, never executed or printed into a command. Every other event: all languages.
  changes:
    name: Languages to analyse
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      any: ${{ steps.pick.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit and its parents: enough for the diff against the base branch
          fetch-depth: 2

      - name: Pick languages
        id: pick
        env:
          EVENT: ${{ github.event_name }}
        run: |
          python3 -I - <<'PY'
          import json, os, re, subprocess
          # language -> (build mode, runner, pattern of the files that count for it)
          LANGUAGES = {
              "actions": ("none", "ubuntu-24.04", r"^\.github/(workflows|actions)/"),
              "python": ("none", "ubuntu-24.04", r"\.py$"),
              "java-kotlin": ("manual", "ubuntu-24.04",
                              r"^android/.*\.(kt|java|kts|toml|pro|properties|lockfile)$"
                              r"|^android/.*/AndroidManifest\.xml$|^android/.*/res/xml/|^android/gradle/"),
              "swift": ("manual", "macos-26",
                        r"^ios/.*\.(swift|pbxproj|plist|entitlements|xcprivacy)$|^ios/project\.yml$"),
          }
          ALL = r"^\.github/workflows/codeql\.yml$"   # a change of this workflow analyses everything
          if os.environ["EVENT"] == "pull_request":
              changed = subprocess.run(["git", "diff", "--name-only", "-z", "HEAD^1", "HEAD"], check=True,
                                       capture_output=True, text=True).stdout.split("\0")
              everything = any(re.search(ALL, f) for f in changed)
              picked = [l for l, (_, _, pattern) in LANGUAGES.items()
                        if everything or any(re.search(pattern, f) for f in changed)]
          else:
              picked = list(LANGUAGES)
          matrix = {"include": [{"language": l, "build-mode": LANGUAGES[l][0], "runner": LANGUAGES[l][1]}
                                for l in picked]}
          print("languages:", ", ".join(picked) or "none")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("matrix=" + json.dumps(matrix) + "\n")
              out.write("any=" + ("true" if picked else "false") + "\n")
          PY

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: changes
    # An empty matrix is an error for GitHub, so the job is skipped when no language is left
    if: needs.changes.outputs.any == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      security-events: write   # upload of the results
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      # Dependency cache only (read-only): the compile tasks below must really run, otherwise CodeQL sees no code
      - name: Set up Gradle (with cache)
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Default suite plus the extended security queries (more Android/intent/crypto rules, more injection
          # patterns for workflows)
          queries: security-extended

      # One variant, compile only (no packaging, no R8, no lint). No daemon, no build or configuration cache and
      # the Kotlin compiler inside the Gradle process, so the CodeQL tracer observes every compiler call.
      - name: Build Kotlin and Java (debug, compile only)
        if: matrix.language == 'java-kotlin'
        working-directory: android
        run: |
          ./gradlew --no-daemon --no-build-cache --no-configuration-cache \
            -Pkotlin.compiler.execution.strategy=in-process \
            :app:compileDebugKotlin :app:compileDebugJavaWithJavac \
            :wear:compileDebugKotlin :wear:compileDebugJavaWithJavac

      # Same scheme as ios.yml (app, widgets, watch app, watch widgets). One architecture, no optimisation and
      # whole-module compilation: CodeQL extracts once per compiler call, and a file-by-file Debug build calls the
      # compiler hundreds of times (more than 90 minutes), a whole-module build once per target. The log goes to a
      # file, the end and the compiler errors are printed.
      - name: Build Swift (Debug, simulator, compile only)
        if: matrix.language == 'swift'
        working-directory: ios
        run: |
          LOG="$RUNNER_TEMP/xcode-build-codeql.log"
          set +e
          xcodebuild build \
            -project CryptoChecker.xcodeproj \
            -scheme CryptoChecker \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedDataCodeQL" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            SWIFT_COMPILATION_MODE=wholemodule SWIFT_OPTIMIZATION_LEVEL=-Onone COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            > "$LOG" 2>&1
          status=$?
          set -e
          tail -n 40 "$LOG"
          bash "$GITHUB_WORKSPACE/.github/scripts/xcode_errors.sh" "$LOG"
          exit $status

      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
