# Mutation tests of the Android portfolio and tax logic (FIFO, average cost, fee expenses, display-currency
# conversion, tax engines, tax export rows, CSV import parsers, currency conversion): .github/scripts/mutation_test.py
# changes one operator, literal or return value at a time, runs the unit-test classes that cover the file and reports
# whether the tests noticed it. The choice of mutants uses the ISO calendar week (UTC) as seed, so every week tests
# another sample; the seed is printed in the log (rerun a week with --seed <week> --list locally). A surviving
# mutant is a warning (a gap in the tests, not a bug); the run is red only when the baseline unit tests fail or the
# script itself fails (missing target file, test filter without tests, a file that could not be restored).
# Never a required check. Weekly on Saturdays and by hand.
name: Mutation tests

on:
  schedule:
    - cron: '17 4 * * 6'   # Saturdays 04:17 UTC
  workflow_dispatch:
    inputs:
      per_file:
        description: 'Mutants per file (at most)'
        required: false
        default: '4'
      max_total:
        description: 'Mutants in total (at most)'
        required: false
        default: '50'
      only:
        description: 'Only target files whose path contains this text (empty = all)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    name: Mutation tests (Android)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      # Read-only cache: the mutant runs would only write a cache full of mutated build outputs; the regular Android
      # workflow keeps the cache up to date
      - name: Set up Gradle (cache, read only)
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      # Mutants are only meaningful against green tests; this run also fills the Gradle caches, so the mutant runs
      # below work with --offline
      - name: Baseline unit tests
        env:
          REQUIRE_IOS_SOURCES: 'true'
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Mutation tests
        working-directory: ${{ github.workspace }}
        env:
          REQUIRE_IOS_SOURCES: 'true'
          PER_FILE: ${{ inputs.per_file || '4' }}
          MAX_TOTAL: ${{ inputs.max_total || '50' }}
          ONLY: ${{ inputs.only || '' }}
        run: |
          for v in "$PER_FILE" "$MAX_TOTAL"; do
            case "$v" in ''|*[!0-9]*) echo "::error title=Mutation tests::not a number: $v"; exit 1 ;; esac
          done
          python3 -I .github/scripts/mutation_test.py --self-test
          # Seed of the mutant choice: ISO year and calendar week in UTC (e.g. 2026-W43)
          SEED=$(date -u +%G-W%V)
          echo "Mutant selection seed (ISO week): $SEED"
          F="$RUNNER_TEMP/mutation-findings.txt"
          : > "$F"
          set +e
          python3 -I .github/scripts/mutation_test.py --findings "$F" --per-file "$PER_FILE" --max-total "$MAX_TOTAL" \
            --time-limit 55 --mutant-timeout 600 --only "$ONLY" --seed "$SEED"
          code=$?
          set -e
          # Surviving mutants are warnings (annotate.py exits 0 for them); the step fails only with the script
          python3 -I .github/scripts/annotate.py "$F" "Mutation tests" || true
          exit "$code"
