# Reproducible Android build: the same commit is built twice on two fresh runners (no Gradle cache, no build cache,
# no configuration cache), and the unsigned release APK and AAB, the unsigned Wear OS release APK and the SBOM are
# compared byte for byte by .github/scripts/repro_compare.py. Identical outputs prove that the published source and the locked, checksummed
# dependencies (gradle.lockfile, verification-metadata.xml) fully determine the app; a difference names the archive
# entries that differ. Signing happens afterwards on the owner's machine and adds only the signature block.
# iOS is not covered: Xcode builds are not byte-reproducible (code signature, build UUIDs).
# Not a required check: on main, on release tags, weekly, by hand and on pull requests that change the check.
# Release tags v*: once both builds agree, «provenance» attests the unsigned APKs (app, Wear OS) and AAB of run a with
# a signed build-provenance statement (actions/attest-build-provenance, Sigstore; only this job may request an OIDC token and
# write attestations) and lists their SHA-256 in the job summary. Check a download with
#   gh attestation verify <file> --repo <owner>/<repo>
# and a signed store APK against it as described in DEVELOPMENT.md («Reproducible build»).
name: Reproducible build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'android/**'
      - '.github/workflows/reproducible.yml'
      - '.github/scripts/repro_compare.py'
      - '.github/scripts/sbom.py'
  # Pull requests only when the check itself changes (it doubles the build time)
  pull_request:
    paths:
      - '.github/workflows/reproducible.yml'
      - '.github/scripts/repro_compare.py'
      - '.github/scripts/sbom.py'
  schedule:
    - cron: '23 4 * * 0'   # Sundays 04:23 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reproducible-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Release build ${{ matrix.run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        run: [a, b]
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      # No cache at all: each run downloads and builds everything itself
      - name: Set up Gradle (no cache)
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true

      # Same flags as the Android workflow; -PgitCommit is the commit itself (identical in both runs)
      - name: Build release APK and AAB (unsigned)
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease :app:bundleRelease :wear:assembleRelease -PgitCommit="$GITHUB_SHA" \
            --no-build-cache --no-configuration-cache --stacktrace

      - name: Collect outputs
        working-directory: .
        run: |
          OUT="$RUNNER_TEMP/out"
          mkdir -p "$OUT"
          cp android/app/build/outputs/apk/release/*.apk "$OUT/"
          cp android/app/build/outputs/bundle/release/*.aab "$OUT/"
          cp android/wear/build/outputs/apk/release/*.apk "$OUT/"
          python3 -I .github/scripts/sbom.py . "$OUT"
          ls -l "$OUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repro-${{ matrix.run }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
          retention-days: 7

  compare:
    name: Compare builds
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read     # download this run's artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # gh (preinstalled) downloads this run's artifacts
      - name: Download builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for run in a b; do
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "repro-$run" --dir "$RUNNER_TEMP/repro/repro-$run"
          done

      - name: Compare
        run: |
          python3 -I .github/scripts/repro_compare.py --self-test
          python3 -I .github/scripts/repro_compare.py "$RUNNER_TEMP/repro/repro-a" "$RUNNER_TEMP/repro/repro-b" \
            "$RUNNER_TEMP/repro.tsv"
          python3 -I .github/scripts/annotate.py "$RUNNER_TEMP/repro.tsv" "Reproducible build"

  provenance:
    name: Build provenance (release tag)
    needs: compare
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write       # only to add the SHA-256 to an existing release of this tag (last step)
      id-token: write       # OIDC token for the Sigstore signing certificate
      attestations: write   # store the attestation in this repository
    steps:
      # Same run, so no token permission is needed for the download
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: repro-a
          path: ${{ runner.temp }}/release

      - name: SHA-256 of the unsigned artifacts
        working-directory: ${{ runner.temp }}/release
        run: |
          shopt -s nullglob
          files=(*.apk *.aab)
          if [ "${#files[@]}" -lt 2 ]; then
            echo "::error::expected the unsigned APK and AAB in repro-a"
            exit 1
          fi
          sha256sum "${files[@]}" | tee SHA256SUMS
          {
            echo "### Unsigned release artifacts ($GITHUB_REF_NAME, commit \`$GITHUB_SHA\`)"
            echo ""
            echo "Reproduced by two independent builds; attested below. Also appended to the release of this tag, if one exists."
            echo ""
            echo "| File | SHA-256 |"
            echo "| --- | --- |"
            while read -r sum name; do echo "| \`$name\` | \`$sum\` |"; done < SHA256SUMS
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/release/*.apk
            ${{ runner.temp }}/release/*.aab

      # Append the hashes to the GitHub release of this tag when one exists (created by hand); no release = nothing
      # to do. Only the release notes are touched; assets stay as they are.
      - name: SHA-256 in the release notes
        working-directory: ${{ runner.temp }}/release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "No release for $TAG yet - hashes only in the job summary"
            exit 0
          fi
          notes=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json body --jq .body)
          if printf '%s' "$notes" | grep -q 'Unsigned release artifacts (SHA-256)'; then
            echo "Hashes already in the release notes"
            exit 0
          fi
          {
            printf '%s\n\n' "$notes"
            echo "#### Unsigned release artifacts (SHA-256)"
            echo ""
            while read -r sum name; do echo "- \`$name\`: \`$sum\`"; done < SHA256SUMS
            echo ""
            echo "Build provenance: \`gh attestation verify <file> -R $GITHUB_REPOSITORY\`"
          } > notes.md
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes-file notes.md
