# Release gate for the Android app (android/): unit tests, lint (debug and release), instrumented
# tests compiled, debug and release (R8, unsigned) APK and AAB, an audit of the release build
# (merged manifest policy, R8 mapping, baseline profile, 16 KB alignment; results as annotations)
# and the release evidence as artifact; on pull requests also a dependency review. Gate: unit-test line coverage
# (Kover, «logic» below MIN_LOGIC is red; notice with the numbers). Display only (never red): lint warnings by id.
name: Android

on:
  push:
    branches: [main]
    # Release tags (v<versionName>-<versionCode>) always run the full gate; GitHub does not
    # evaluate the paths filter for tag pushes, so every workflow runs for the tagged commit
    tags: ['v*']
    paths:
      - 'android/**'
      # The source guards in the unit tests (FileLengthTest, HapticsUsageTest, licences, typography, …) also
      # check the Swift sources: a push to main that only touches iOS must run them too
      - 'ios/App/**'
      - 'ios/Shared/**'
      - 'ios/Widgets/**'
      - '.github/workflows/android.yml'
      - '.github/scripts/android_release_audit.sh'
      - '.github/scripts/manifest_policy.py'
      - '.github/scripts/apk_contents.py'
      - '.github/scripts/annotate.py'
      - '.github/scripts/lint_errors.sh'
      - '.github/scripts/room_schema_drift.py'
      - '.github/scripts/line_limit.py'
      - '.github/scripts/code_metrics.py'
      - '.github/scripts/lint_warnings.py'
      - '.github/scripts/coverage_summary.py'
      - '.github/scripts/sbom.py'
      - 'ios/project.yml'
  # Pull requests always run this workflow (no paths filter): its job is a required check, and a required check
  # whose workflow is skipped by a paths filter would wait forever («Expected»).
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  # Pull requests: a newer push replaces the run; main keeps every run so each commit gets a result
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Android build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The project targets Java 17 (compileOptions); Android Gradle Plugin 9 needs JDK 17+.
      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Production sources (android/*/src/main, ios/App, ios/Shared, ios/Widgets) at most 400 lines each — fails
      # fast without Gradle (same rule as FileLengthTest)
      - name: Line limit
        run: |
          python3 -I "$GITHUB_WORKSPACE/.github/scripts/line_limit.py" --self-test
          python3 -I "$GITHUB_WORKSPACE/.github/scripts/line_limit.py" "$GITHUB_WORKSPACE"

      # Theme colours (every accent, light/dark, high contrast, selection tints, error fills, placeholders) against
      # WCAG 4.5:1 / 3:1; the script cross-checks its values with AppColorSchemes.kt, ErrorColors.kt and Theme.swift
      - name: Theme contrast
        run: python3 -I "$GITHUB_WORKSPACE/android/tools/check_theme_contrast.py"

      # Size of the Hilt-wired Kotlin classes (android/*/src/main), next to the line limit: constructor dependencies of
      # @HiltViewModel / @Inject classes (warning from 15, red above the ceiling 20) and private/internal properties
      # in a ViewModel body (red above the ceiling) — ceilings = today's maximum, so no class grows past it.
      - name: Code metrics
        run: |
          python3 -I "$GITHUB_WORKSPACE/.github/scripts/code_metrics.py" --self-test
          python3 -I "$GITHUB_WORKSPACE/.github/scripts/code_metrics.py" "$GITHUB_WORKSPACE"

      # Manifest policy rules (exported widget setup activities allowed only as listed) — fails fast without Gradle;
      # the policy itself runs on the merged release manifest in the release audit
      - name: Manifest policy self-test
        run: python3 -I "$GITHUB_WORKSPACE/.github/scripts/manifest_policy.py" --self-test

      # testDebugUnitTest of all modules, including the Android/iOS parity cases in testdata/parity
      # (ParityFixturesTest), ONCE and with Kover (-Pcoverage=true): the coverage reports of :app and :marketdata for
      # the step «Coverage (logic gate)» come from this same run.
      # The source guards must find the Swift sources (whole repo checked out); without the variable a missing ios/
      # only marks those tests as skipped (Android-only checkout)
      - name: Unit tests
        env:
          REQUIRE_IOS_SOURCES: 'true'
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew -Pcoverage=true testDebugUnitTest :app:koverXmlReportDebug :marketdata:koverXmlReportDebug \
            --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle-test.log"

      # testReleaseUnitTest of all modules (release source sets, e.g. src/withoutHttpLog) only on main and release
      # tags; pull requests and other branches run the debug unit tests only.
      - name: Release unit tests
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        env:
          REQUIRE_IOS_SOURCES: 'true'
        run: |
          set -o pipefail
          ./gradlew testReleaseUnitTest --stacktrace 2>&1 | tee -a "$RUNNER_TEMP/gradle-test.log"

      # Performance tests (app/src/test/.../performance: timings with 2000 pairs and 10 000 portfolio transactions) on
      # their own, after the unit tests and before lint: nothing else runs in parallel, so the timings do not depend on
      # the load of the runner. The normal unit-test run excludes them (app/build.gradle.kts, -PperformanceTests).
      - name: Performance tests
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest -PperformanceTests=only --stacktrace 2>&1 | tee -a "$RUNNER_TEMP/gradle-test.log"

      # Kotlin compiler warnings in the app and library sources: ceiling 0 (like lint and the iOS release build).
      # A fresh checkout compiles every changed module in full, so all warnings of that module appear in the log; a
      # module whose compile output comes from the Gradle build cache prints none (it was unchanged and checked when it
      # was compiled). Test sources are not counted.
      - name: Kotlin warnings
        run: |
          W=$(grep -E '^w: (file://)?[^ ]*/src/main/' "$RUNNER_TEMP/gradle-test.log" | sort -u || true)
          if [ -n "$W" ]; then
            echo "$W" | head -50 | sed 's/^w: /::error title=Kotlin warning::/'
            echo "::error title=Kotlin warnings::$(echo "$W" | wc -l) Kotlin warning(s) in main sources (ceiling 0)"
            exit 1
          fi
          echo "0 Kotlin warnings in main sources"

      # Compile errors and failed tests as annotations (the raw log is not always reachable)
      - name: Unit test errors
        if: failure()
        run: |
          # GitHub shows only about 10 annotations per step: failed tests with their assertion and the test-file line in
          # ONE annotation (line breaks as %0A)
          DETAILS=$(grep -E ' FAILED$|^\s+(java|kotlin|org\.junit)\.[A-Za-z.]*(Error|Exception|Failure)|^\s+at [^(]*\([A-Za-z]+Test\.kt:[0-9]+\)' \
            "$RUNNER_TEMP/gradle-test.log" | head -60 | sed -E 's/^\s+//' | awk '{printf "%s%%0A", $0}' || true)
          [ -z "$DETAILS" ] || echo "::error title=Failed unit tests (details)::$DETAILS"
          grep -E '^e: |FAILED|Exception|expected:' "$RUNNER_TEMP/gradle-test.log" | head -60 | sed 's/^/::error::/' || true

      # Instrumented tests (app/src/androidTest: CoreFlowTest, UiFlowsTest, database tests) are only
      # compiled here: running them needs an emulator (locally: ./gradlew :app:connectedDebugAndroidTest;
      # in CI: workflow «Android device tests» on every push to main and by hand; on pull requests that touch the
      # databases only the migration and encryption tests).
      - name: Compile instrumented tests
        run: ./gradlew :app:assembleDebugAndroidTest --stacktrace

      # Room exports its schemas while compiling (app/schemas). A changed entity without a new database
      # version shows up as a different identity hash or a new, uncommitted schema file: fail before it
      # crashes an update (formatting differences alone do not count).
      - name: Room schema drift
        run: python3 -I "$GITHUB_WORKSPACE/.github/scripts/room_schema_drift.py" app/schemas

      # Lint as a gate (abortOnError = true in app/ and marketdata/build.gradle.kts): report uploaded on failure.
      # Release too: the store build has its own source set (src/withoutHttpLog) and R8-only checks.
      # The exchange module (marketdata) on its own as well, with its own lint settings.
      - name: Lint
        run: ./gradlew :app:lintDebug :app:lintRelease :marketdata:lintRelease :domain:lintRelease --stacktrace

      # Lint warnings counted by id as ONE notice (top 20), to reduce them step by step; never fails. XML report if
      # present, else the text report (same paths as «Lint errors»)
      - name: Lint warnings
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          python3 -I "$GITHUB_WORKSPACE/.github/scripts/lint_warnings.py" --self-test
          python3 -I "$GITHUB_WORKSPACE/.github/scripts/lint_warnings.py" \
            --report app/build/reports/lint-results-debug.xml,app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt \
            --report app/build/reports/lint-results-release.xml,app/build/intermediates/lint_intermediate_text_report/release/lintReportRelease/lint-results-release.txt \
            --report marketdata/build/reports/lint-results-release.xml,marketdata/build/intermediates/lint_intermediate_text_report/release/lintReportRelease/lint-results-release.txt \
            --report domain/build/reports/lint-results-release.xml,domain/build/intermediates/lint_intermediate_text_report/release/lintReportRelease/lint-results-release.txt \
            --details

      # Lint errors as annotations (the log shows only the first one; the run page shows these
      # without signing in)
      - name: Lint errors
        if: failure()
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/lint_errors.sh" app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          bash "$GITHUB_WORKSPACE/.github/scripts/lint_errors.sh" app/build/intermediates/lint_intermediate_text_report/release/lintReportRelease/lint-results-release.txt
          bash "$GITHUB_WORKSPACE/.github/scripts/lint_errors.sh" marketdata/build/intermediates/lint_intermediate_text_report/release/lintReportRelease/lint-results-release.txt
          bash "$GITHUB_WORKSPACE/.github/scripts/lint_errors.sh" domain/build/intermediates/lint_intermediate_text_report/release/lintReportRelease/lint-results-release.txt

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      # Release build without keystore stays unsigned (app/build.gradle.kts); it runs R8/minify and
      # resource shrinking, so missing keep rules show up here and not only on a device. The AAB is
      # what goes to Play (native debug symbols, baseline profile and R8 mapping inside).
      # -PgitCommit: source commit in BuildConfig.GIT_COMMIT ("Share diagnostics"); without it Gradle
      # falls back to GITHUB_SHA, local builds say "local".
      - name: Build release APK and AAB (unsigned, R8)
        run: ./gradlew :app:assembleRelease :app:bundleRelease -PgitCommit="$GITHUB_SHA" --stacktrace

      # Software bill of materials (CycloneDX 1.5): every library the release build ships, with version, package URL
      # and the SHA-256 Gradle verifies (lock files + verification-metadata.xml); iOS has no third-party packages.
      # Deterministic (no timestamp), kept as artifact «sbom» for 90 days. Details: .github/scripts/sbom.py.
      - name: SBOM
        working-directory: .
        run: |
          python3 -I .github/scripts/sbom.py --self-test
          python3 -I .github/scripts/sbom.py . "$RUNNER_TEMP/sbom"

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom/
          if-no-files-found: error
          retention-days: 90

      # Audit of the release build as annotations (readable without the raw log). Errors are release
      # blockers: forbidden permissions, debuggable/testOnly/cleartext, exported components without
      # permission, typed foreground services, missing APK/AAB/R8 mapping. Warnings: baseline
      # profile, 16 KB alignment, merged manifest not found. Details: android_release_audit.sh.
      - name: Release audit
        run: |
          FINDINGS="$RUNNER_TEMP/android-release-findings.tsv"
          bash "$GITHUB_WORKSPACE/.github/scripts/android_release_audit.sh" "$FINDINGS" "$RUNNER_TEMP/release-evidence"
          python3 -I "$GITHUB_WORKSPACE/.github/scripts/annotate.py" "$FINDINGS" "Android release audit"

      # Unit-test line coverage of :app, :domain and :marketdata as ONE notice: total and «logic» (without Compose/widget
      # rendering, activities and generated code). The :app report also measures :domain and :marketdata (their tests
      # run mostly in :app); every module must be listed, or its files count as generated (no sources found) and drop
      # out of «logic»; :marketdata's own report is listed as «own tests only». The reports come
      # from the debug unit-test run of the step «Unit tests» (Kover via -Pcoverage=true); no tests run again here.
      # Gate: the merged «logic» coverage must not fall below MIN_LOGIC (set just under the measured value, so
      # it stops regressions without forcing new work; raise it when coverage grows). No report = red.
      - name: Coverage (logic gate)
        timeout-minutes: 15
        env:
          REQUIRE_IOS_SOURCES: 'true'
          MIN_LOGIC: '58'
        run: |
          python3 -I "$GITHUB_WORKSPACE/.github/scripts/coverage_summary.py" --self-test
          python3 -I "$GITHUB_WORKSPACE/.github/scripts/coverage_summary.py" --merged app --min-logic "$MIN_LOGIC" \
            app=app domain=domain marketdata=marketdata

      # Evidence of the audited release build: R8 mapping (deobfuscate crashes of exactly this
      # build), AAB, merged manifest with summary and merger report.
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-release-evidence
          path: ${{ runner.temp }}/release-evidence/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cryptochecker-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            android/**/build/reports/tests/
            android/app/build/reports/lint-results-*.html
            android/marketdata/build/reports/lint-results-*.html
            android/domain/build/reports/lint-results-*.html
            android/app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
            android/app/build/intermediates/lint_intermediate_text_report/release/lintReportRelease/lint-results-release.txt
          if-no-files-found: ignore

  # Dependency graph for GitHub (Dependabot alerts) from the resolved Gradle dependencies.
  # Only when «Dependency graph» is on in the repository settings AND the repository variable
  # DEPENDENCY_GRAPH is «true» (Settings › Secrets and variables › Actions › Variables);
  # otherwise GitHub rejects the upload with «The Dependency graph is disabled».
  # Two jobs: «dependency-graph» resolves the dependencies with Gradle (read permission only) and stores the graph as
  # an artifact of this run; «dependency-submission» (write permission) runs no Gradle and only submits that
  # artifact. This way the third-party build code (lenient, the action's plugin) never runs with a write token.
  dependency-graph:
    if: github.event_name == 'push' && vars.DEPENDENCY_GRAPH == 'true'
    runs-on: ubuntu-24.04
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate Gradle dependency graph
        uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          build-root-directory: android
          dependency-graph: generate-and-upload
          # The action injects its own Gradle plugin, which is not in gradle/verification-metadata.xml; this job only
          # reports the graph, builds nothing and has no write token
          additional-arguments: --dependency-verification lenient

  dependency-submission:
    needs: dependency-graph
    if: github.event_name == 'push' && vars.DEPENDENCY_GRAPH == 'true'
    runs-on: ubuntu-24.04
    continue-on-error: true
    permissions:
      contents: write   # Dependency Submission API
    steps:
      # No checkout, no Gradle: only downloads this run's graph artifact and submits it
      - name: Submit Gradle dependency graph
        uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          dependency-graph: download-and-submit

  # Pull requests: fail on newly added dependencies with known vulnerabilities (high and above).
  dependency-review:
    if: github.event_name == 'pull_request' && vars.DEPENDENCY_GRAPH == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
