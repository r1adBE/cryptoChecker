# Release gate for the Android app (android/): unit tests, lint, instrumented tests compiled,
# debug and release (R8, unsigned) builds; on pull requests also a dependency review.
name: Android

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The project targets Java 17 (compileOptions); Android Gradle Plugin 9 needs JDK 17+.
      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # "test" = testDebugUnitTest + testReleaseUnitTest of all modules, including the
      # Android/iOS parity cases in testdata/parity (ParityFixturesTest).
      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew test --stacktrace

      # Instrumented tests (app/src/androidTest: CoreFlowTest, UiFlowsTest, database tests) are only
      # compiled here: running them needs an emulator (locally: ./gradlew :app:connectedDebugAndroidTest;
      # in CI: workflow «Android device tests», started by hand).
      - name: Compile instrumented tests
        run: ./gradlew :app:assembleDebugAndroidTest --stacktrace

      # Lint as a gate (abortOnError = true in app/build.gradle): report uploaded on failure.
      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace

      # Lint errors as annotations (the log shows only the first one; the run page shows these
      # without signing in)
      - name: Lint errors
        if: failure()
        run: bash "$GITHUB_WORKSPACE/.github/scripts/lint_errors.sh" app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      # Release build without keystore stays unsigned (app/build.gradle); it runs R8/minify and
      # resource shrinking, so missing keep rules show up here and not only on a device.
      - name: Build release (unsigned, R8)
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cryptochecker-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            android/**/build/reports/tests/
            android/app/build/reports/lint-results-*.html
            android/app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if-no-files-found: ignore

  # Dependency graph for GitHub (Dependabot alerts) from the resolved Gradle dependencies.
  # Only when «Dependency graph» is on in the repository settings AND the repository variable
  # DEPENDENCY_GRAPH is «true» (Settings › Secrets and variables › Actions › Variables);
  # otherwise GitHub rejects the upload with «The Dependency graph is disabled».
  dependency-submission:
    if: github.event_name == 'push' && vars.DEPENDENCY_GRAPH == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Submit Gradle dependency graph
        uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          build-root-directory: android

  # Pull requests: fail on newly added dependencies with known vulnerabilities (high and above).
  dependency-review:
    if: github.event_name == 'pull_request' && vars.DEPENDENCY_GRAPH == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
