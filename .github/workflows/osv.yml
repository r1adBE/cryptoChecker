# Known vulnerabilities in the Android release dependencies: the resolved releaseRuntimeClasspath of :app (includes
# :marketdata, :domain and :data) and of :wear (own APK for the watch) is checked against the public OSV database (api.osv.dev, no secrets) by .github/scripts/osv_check.py.
# Findings are annotations. A vulnerability with a fixed version is an error on main, on release tags and in the
# weekly run (the weekly run catches advisories published after the last push); on pull requests it is a warning.
# Without a fix, or when OSV is not reachable: warning. An accepted finding goes into .github/osv-ignore.txt
# («ID  # reason», OSV/GHSA/CVE id) and is then only a notice.
name: Dependency vulnerabilities

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'android/**'
      - '.github/workflows/osv.yml'
      - '.github/scripts/osv_check.py'
      - '.github/scripts/annotate.py'
      - '.github/osv-ignore.txt'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/osv.yml'
      - '.github/scripts/osv_check.py'
      - '.github/scripts/annotate.py'
      - '.github/osv-ignore.txt'
  schedule:
    - cron: '43 6 * * 2'   # Tuesdays 06:43 UTC (kept enabled by keepalive.yml)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: osv-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  osv:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Dependency tree after conflict resolution (what ships in the release APK/AAB); no build needed
      - name: Resolve release runtime classpath
        run: |
          chmod +x gradlew
          ./gradlew -q --no-configuration-cache :app:dependencies --configuration releaseRuntimeClasspath > "$RUNNER_TEMP/release-deps.txt"
          # Watch app: own release APK with its own libraries (Wear Compose, complications, protolayout ...);
          # appended to the same tree (osv_check.py reads it line by line, duplicate coordinates are harmless)
          ./gradlew -q --no-configuration-cache :wear:dependencies --configuration releaseRuntimeClasspath >> "$RUNNER_TEMP/release-deps.txt"
          echo "Resolved lines: $(wc -l < "$RUNNER_TEMP/release-deps.txt")"

      - name: OSV check
        run: |
          python3 -I "$GITHUB_WORKSPACE/.github/scripts/osv_check.py" --self-test
          STRICT=""
          case "$GITHUB_REF" in
            refs/heads/main|refs/tags/*) STRICT="--strict" ;;
          esac
          FINDINGS="$RUNNER_TEMP/osv-findings.tsv"
          # shellcheck disable=SC2086
          python3 -I "$GITHUB_WORKSPACE/.github/scripts/osv_check.py" $STRICT \
            --ignore "$GITHUB_WORKSPACE/.github/osv-ignore.txt" "$RUNNER_TEMP/release-deps.txt" "$FINDINGS"
          python3 -I "$GITHUB_WORKSPACE/.github/scripts/annotate.py" "$FINDINGS" "OSV"
