# Checks the translations: Android string resources (75 languages, placeholders,
# plural forms, references in the code) and the iOS string catalog generated from them.
name: Strings

on:
  push:
    branches: [main]
    # Release tags (v<versionName>-<versionCode>) always run the full gate; GitHub does not
    # evaluate the paths filter for tag pushes, so every workflow runs for the tagged commit
    tags: ['v*']
    paths:
      # check_strings.py reads the values of every module (app, wear, …)
      - 'android/*/src/main/res/**'
      - 'android/**/*.kt'
      - 'ios/tools/**'
      # Serbian Latin is generated from values-sr (check_strings.py runs it with --check)
      - 'android/tools/sr_latn.py'
      - 'ios/Shared/Resources/*.xcstrings'
      - 'ios/**/*.swift'
      - '.github/scripts/check_strings.py'
      - '.github/workflows/strings.yml'
  # Pull requests always run this workflow (no paths filter): its job is a required check, and a required check
  # whose workflow is skipped by a paths filter would wait forever («Expected»).
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: strings-${{ github.ref }}
  # Pull requests: a newer push replaces the run; main keeps every run so each commit gets a result
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Strings check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Serbian Latin transliteration (self-test)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -I android/tools/sr_latn.py --self-test

      - name: Check strings
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 .github/scripts/check_strings.py
