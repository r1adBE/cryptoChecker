# Checks the translations: Android string resources (31 languages, placeholders,
# plural forms, references in the code) and the iOS string catalog generated from them.
name: Strings

on:
  push:
    branches: [main]
    # Release tags (v<versionName>-<versionCode>) always run the full gate; GitHub does not
    # evaluate the paths filter for tag pushes, so every workflow runs for the tagged commit
    tags: ['v*']
    paths:
      - 'android/app/src/main/res/**'
      - 'android/**/*.kt'
      - 'ios/tools/**'
      - 'ios/Shared/Resources/*.xcstrings'
      - 'ios/**/*.swift'
      - '.github/scripts/check_strings.py'
      - '.github/workflows/strings.yml'
  pull_request:
    paths:
      - 'android/app/src/main/res/**'
      - 'android/**/*.kt'
      - 'ios/tools/**'
      - 'ios/Shared/Resources/*.xcstrings'
      - 'ios/**/*.swift'
      - '.github/scripts/check_strings.py'
      - '.github/workflows/strings.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: strings-${{ github.ref }}
  # Pull requests: a newer push replaces the run; main keeps every run so each commit gets a result
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Check strings
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 .github/scripts/check_strings.py
