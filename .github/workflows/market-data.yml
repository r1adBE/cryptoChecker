# Mirrors public market data that is the same for every user (Fear & Greed, Coin Metrics
# on-chain values and BTC price history, plus the altcoin season computed from Binance daily
# candles, plus coin_meta.json — the symbols traded on Binance Spot from the documented public
# endpoint /api/v3/exchangeInfo only, no names, logos or images) once an hour as
# assets of the release «data», so the apps ask one place instead of every phone asking
# each provider: https://github.com/r1adBE/cryptoChecker/releases/download/data/<file>
# Nothing is committed. The apps fall back to the providers when a file is too old.
# Signed: the publish job adds manifest.json (SHA-256 of every file, creation time) and manifest.json.sig (ECDSA P-256,
# secret MIRROR_SIGNING_KEY, environment mirror-signing, main only); the apps use mirror files only with a valid signature (DEVELOPMENT.md, «Data mirror»).
# The manifest also signs the hash of the macro calendar docs/macro/events.json of the checked-out commit (entry
# «macro_events.json»; the file itself is served by GitHub Pages, not uploaded here). macro-calendar.yml starts this
# workflow after committing a new calendar, so the manifest follows within minutes.
# CoinGecko data is never mirrored (CoinGecko API terms); the apps ask CoinGecko directly.
name: Market data

on:
  schedule:
    - cron: '7 * * * *'    # hourly at :07 UTC
  workflow_dispatch:

# Two jobs: «fetch» queries the providers without write permission and hands the files over as an artifact;
# «publish» (write permission, no third-party network requests) freshly checks out github.sha, strictly checks the
# artifact (artifact_check.py) and only then uploads the release assets.
permissions: {}

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-24.04
    permissions:
      contents: read    # checkout only
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Self-test
        run: |
          python3 .github/scripts/mirror_data.py --output "$RUNNER_TEMP/data" --selftest
          python3 -I .github/scripts/artifact_check.py --self-test

      # Provider requests; this job has no write token
      - name: Fetch
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 .github/scripts/mirror_data.py --output "$RUNNER_TEMP/data"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: market-data
          path: ${{ runner.temp }}/data
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: fetch
    # Only on main (workflow_dispatch on another branch publishes nothing either). Environment mirror-signing:
    # MIRROR_SIGNING_KEY lives there once the owner has moved it (only branch main allowed); until then the
    # repository secret of the same name is used (an environment secret takes precedence).
    if: github.ref == 'refs/heads/main'
    environment: mirror-signing
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # gh release create/edit/upload
      actions: read     # download this run's artifact (gh run download)
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          # docs/macro: hash of the economic calendar for the manifest (GitHub Pages serves the file itself)
          sparse-checkout: |
            .github/scripts
            docs/macro
          # Upload uses GH_TOKEN from env; leave no token in .git/config
          persist-credentials: false

      # gh (preinstalled) downloads this run's artifact
      - name: Download artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name market-data --dir "$RUNNER_TEMP/data"

      # Only expected file names, size, rough header/JSON check; nothing from the artifact is executed
      - name: Check artifact
        run: python3 -I .github/scripts/artifact_check.py --dir "$RUNNER_TEMP/data" --profile mirror

      # Manifest (SHA-256 per file) in its own folder, signed with MIRROR_SIGNING_KEY (openssl, preinstalled; no
      # package installation in this job). Files not refreshed keep their hash only from a validly signed previous
      # manifest. Without the secret: manifest without signature (the apps then query the providers directly); the data
      # is uploaded anyway, but the run ends red (Upload, last step).
      - name: Sign manifest
        env:
          GH_TOKEN: ${{ github.token }}
          MIRROR_SIGNING_KEY: ${{ secrets.MIRROR_SIGNING_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/previous"
          gh release download data --repo "$GITHUB_REPOSITORY" --pattern manifest.json --pattern manifest.json.sig \
            --dir "$RUNNER_TEMP/previous" || echo "No previous manifest"
          python3 -I .github/scripts/mirror_data.py --output "$RUNNER_TEMP/data" --manifest "$RUNNER_TEMP/manifest" \
            --previous "$RUNNER_TEMP/previous" --signed-extra macro_events.json=docs/macro/events.json
          python3 -I .github/scripts/artifact_check.py --dir "$RUNNER_TEMP/manifest" --profile mirror_manifest

      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Sources and licences in the release notes (Coin Metrics Community: CC BY-NC 4.0, alternative.me: attribution)
          NOTES='Hourly mirror of public market data for the Crypto Checker apps, same for every user. Not for other use.

          Sources and licences:
          - fng.txt: Fear & Greed Index by alternative.me (https://alternative.me/crypto/fear-and-greed-index/), used with attribution as required by alternative.me.
          - onchain.txt, btcprice.txt: Coin Metrics Community Data (https://coinmetrics.io/community-network-data/), licensed CC BY-NC 4.0 (https://creativecommons.org/licenses/by-nc/4.0/). Source: Coin Metrics.
          - altseason.txt: computed from public Binance daily candles (data-api.binance.vision).
          - coin_meta.json: symbols currently traded on Binance Spot, from the documented public Binance Spot API endpoint GET /api/v3/exchangeInfo (data-api.binance.vision, else api.binance.com). Only used by the apps as a fallback; no names, logos or images are mirrored.
          - manifest.json, manifest.json.sig: SHA-256 of the files above (and of the macro calendar served at https://r1adbe.github.io/cryptoChecker/macro/events.json, entry macro_events.json) and its signature (ECDSA P-256); the apps use a file only if both match.

          No CoinGecko data is mirrored here. Updated by the Market data workflow.'
          if ! gh release view data >/dev/null 2>&1; then
            gh release create data --prerelease --title 'Market data' --notes "$NOTES"
          else
            gh release edit data --notes "$NOTES" || true
          fi
          gh release upload data "$RUNNER_TEMP"/data/* --clobber
          # Manifest last (so it matches the files just uploaded); without a signature, remove the old one
          if [ ! -f "$RUNNER_TEMP/manifest/manifest.json.sig" ]; then
            gh release delete-asset data manifest.json.sig -y || true
          fi
          gh release upload data "$RUNNER_TEMP"/manifest/* --clobber
          {
            echo '### Market data'
            echo '```'
            cat "$RUNNER_TEMP/data/status.json"
            echo '```'
            if [ -f "$RUNNER_TEMP/manifest/manifest.json.sig" ]; then echo 'Manifest signed.'; else echo 'Manifest NOT signed (MIRROR_SIGNING_KEY).'; fi
          } >> "$GITHUB_STEP_SUMMARY"
          # Unsigned manifest: the data was uploaded above, but the run still turns red (otherwise nobody would notice)
          if [ ! -f "$RUNNER_TEMP/manifest/manifest.json.sig" ]; then
            echo '::error title=Mirror signature::manifest.json was published without a valid signature (MIRROR_SIGNING_KEY missing or not usable); the apps ignore the mirror until it is signed again.'
            exit 1
          fi
