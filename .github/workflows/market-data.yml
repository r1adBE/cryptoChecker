# Mirrors public market data that is the same for every user (Fear & Greed, Coin Metrics
# on-chain values and BTC price history, plus the altcoin season computed from Binance daily
# candles, plus coin_meta.json — the symbols traded on Binance Spot from the documented public
# endpoint /api/v3/exchangeInfo only, no names, logos or images) once an hour as
# assets of the release «data», so the apps ask one place instead of every phone asking
# each provider: https://github.com/r1adBE/cryptoChecker/releases/download/data/<file>
# Nothing is committed. The apps fall back to the providers when a file is too old.
# CoinGecko data is never mirrored (CoinGecko API terms); the apps ask CoinGecko directly.
name: Market data

on:
  schedule:
    - cron: '7 * * * *'    # hourly at :07 UTC
  workflow_dispatch:

# Standard nur lesen; Schreibrecht nur im Job, der die Release-Assets hochlädt
permissions:
  contents: read

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # gh release create/edit/upload
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          # Hochladen mit GH_TOKEN aus env; kein Token in .git/config liegen lassen
          persist-credentials: false

      - name: Self-test
        run: python3 .github/scripts/mirror_data.py --output "$RUNNER_TEMP/data" --selftest

      - name: Fetch
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 .github/scripts/mirror_data.py --output "$RUNNER_TEMP/data"

      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Quellen und Lizenzen in den Release-Notizen (Coin Metrics Community: CC BY-NC 4.0, alternative.me: Quellenangabe)
          NOTES='Hourly mirror of public market data for the Crypto Checker apps, same for every user. Not for other use.

          Sources and licences:
          - fng.txt: Fear & Greed Index by alternative.me (https://alternative.me/crypto/fear-and-greed-index/), used with attribution as required by alternative.me.
          - onchain.txt, btcprice.txt: Coin Metrics Community Data (https://coinmetrics.io/community-network-data/), licensed CC BY-NC 4.0 (https://creativecommons.org/licenses/by-nc/4.0/). Source: Coin Metrics.
          - altseason.txt: computed from public Binance daily candles (data-api.binance.vision).
          - coin_meta.json: symbols currently traded on Binance Spot, from the documented public Binance Spot API endpoint GET /api/v3/exchangeInfo (data-api.binance.vision, else api.binance.com). Only used by the apps as a fallback; no names, logos or images are mirrored.

          No CoinGecko data is mirrored here. Updated by the Market data workflow.'
          if ! gh release view data >/dev/null 2>&1; then
            gh release create data --prerelease --title 'Market data' --notes "$NOTES"
          else
            gh release edit data --notes "$NOTES" || true
          fi
          # Remove formerly mirrored CoinGecko files (API terms); ignore failures
          for old in global.txt coins30.txt coins40.txt; do
            gh release delete-asset data "$old" -y || true
          done
          gh release upload data "$RUNNER_TEMP"/data/* --clobber
          {
            echo '### Market data'
            echo '```'
            cat "$RUNNER_TEMP/data/status.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
