# Instrumented tests of the Android app (android/app/src/androidTest) on an emulator:
# CoreFlowTest, the database tests, BackupRestoreTest, WatchlistViewModelTest and UiFlowsTest
# (main flows over the UI: add a coin from the search, price alarm, CSV import with undo, backup
# with password — fake exchange answers, no network; the document picker is answered by
# DocumentPickerStub).
# Too slow for every push (android.yml only compiles them), so started by hand:
# Actions › Android device tests › Run workflow.
name: Android device tests

on:
  workflow_dispatch:
  # Optional weekly run (Monday 04:17 UTC); uncomment to enable.
  # schedule:
  #   - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: android-device-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  connected-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same toolchain as android.yml: Java 17, Gradle with cache.
      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Hardware acceleration for the x86_64 emulator (see reactivecircus/android-emulator-runner).
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Build the app and test APKs before the emulator starts, so its boot time is not wasted.
      - name: Build debug and test APKs
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: android
          # Generous boot wait for the swiftshader emulator; the tests themselves wait up to 60 s
          # per step (loading all pair lists), so the job limit of 60 min leaves ample room.
          emulator-boot-timeout: 900
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace

      # Failed tests as annotations (artifacts are not always reachable for reviewers)
      - name: Failed tests
        if: failure()
        run: |
          python3 - <<'PY' || true
          import glob, xml.etree.ElementTree as ET
          n = 0
          for f in glob.glob('app/build/outputs/androidTest-results/connected/**/*.xml', recursive=True):
              for tc in ET.parse(f).getroot().iter('testcase'):
                  for fail in list(tc.findall('failure')) + list(tc.findall('error')):
                      msg = (fail.get('message') or fail.text or '').strip().splitlines()
                      body = ' | '.join(l.strip() for l in (fail.text or '').strip().splitlines()[:6])
                      print(f"::error::{tc.get('classname')}.{tc.get('name')}: {body[:900]}")
                      n += 1
          print(f"failed tests: {n}")
          PY

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: device-test-reports
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14
