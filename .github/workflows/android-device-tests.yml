# Instrumented tests of the Android app (android/app/src/androidTest) on an emulator:
# CoreFlowTest, the database tests, BackupRestoreTest, WatchlistViewModelTest and UiFlowsTest
# (main flows over the UI: add a coin from the search, price alarm, CSV import with undo, backup
# with password — fake exchange answers, no network; the document picker is answered by
# DocumentPickerStub).
# Every instrumented test class runs (no filter), also AccessibilityAuditTest; ScreenshotTourTest skips itself here (screenshots.yml).
# Runs on pushes to main, on release tags and by hand (Actions › Android device tests › Run workflow). On a pull
# request the job «changes» (git diff against the base branch) decides what runs: connected-tests (all classes, API
# 34) when the sources of a phone module, its device tests or the shared UI test files change, so a broken UI flow is
# seen before the merge and not only on main; release-smoke only when a file changes that decides about the R8
# release build (keep rules, build script, dependency versions, the smoke test itself); migration-tests only when
# the Room schemas change without sources (otherwise connected-tests already runs these classes). Every pull request
# starts this workflow (no paths filter): the job «Android device tests» at the end collects the results under the
# name of a required check – a job that «changes» did not pick counts as green, a failed, hung (stopped by its time
# limit) or never started one as red.
# Job connected-tests-api26 (not on pull requests): only the ICU device tests (TextLimit, MonthYearFormat) on API 26
# (minSdk).
# Job migration-tests (pull requests only): RoomSchemaMigrationTest, DatabaseFreshInstall* and DatabaseEncryption*
# on API 34.
# Job release-smoke: the R8 release build (signed with a throwaway key) on API 26 (minSdk) and 34:
# start, monkey, WorkManager jobs, crash buffer -> annotations (android_smoke_test.sh).
name: Android device tests

on:
  workflow_dispatch:
  # Also on every push to main that touches the Android app or the shared test data (UI, database and migration
  # tests on an emulator are part of the push gate, not only a manual run), and on every release tag v*.
  push:
    branches: [main]
    # Release tags (v<versionName>-<versionCode>) always run the full gate; GitHub does not
    # evaluate the paths filter for tag pushes, so every workflow runs for the tagged commit
    tags: ['v*']
    paths:
      - 'android/**'
      - '.github/workflows/android-device-tests.yml'
      - '.github/scripts/android_smoke_test.sh'
      - '.github/scripts/annotate.py'
      - '.github/scripts/collect_jobs.py'
      - '.github/scripts/run_device_classes.sh'
  # Every pull request (no paths filter): «Android device tests» is a required check, and a required check whose
  # workflow is skipped by a paths filter would wait forever («Expected»). The job «changes» picks the jobs.
  pull_request:
  # Optional weekly run (Monday 04:17 UTC); uncomment to enable.
  # schedule:
  #   - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: android-device-tests-${{ github.ref }}
  # Pull requests: a newer push replaces the run; main keeps every run so each commit gets a result
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pull requests only: which of the PR jobs below are needed, from the files the pull request changes. Plain git
  # diff between the merge commit and its first parent (the base branch), no third-party action.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      connected: ${{ steps.diff.outputs.connected }}
      migration: ${{ steps.diff.outputs.migration }}
      release: ${{ steps.diff.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit and its parents: enough for the diff against the base branch
          fetch-depth: 2

      - name: Changed files
        id: diff
        run: |
          set -euo pipefail
          CHANGED="$RUNNER_TEMP/changed-files.txt"
          git diff --name-only HEAD^1 HEAD > "$CHANGED"
          echo "Changed files: $(wc -l < "$CHANGED")"
          cat "$CHANGED"
          # grep reads files, never a pipe: with pipefail, «printf | grep -q» failed by SIGPIPE on a long list and
          # skipped jobs of a large pull request. Fail-safe: only grep's explicit «no match» (exit 1) is «no».
          has() { local rc=0; grep -q "$@" || rc=$?; [ "$rc" -ne 1 ]; }
          CONNECTED=false
          MIGRATION=false
          RELEASE=false
          # Unit tests (src/test, src/testDebug …) do not run on a device
          # (grep error → keep every file, so the tests run)
          grep -vE '^android/[a-z]+/src/test[A-Za-z]*/' "$CHANGED" > "$RUNNER_TEMP/changed-device.txt" \
            || [ $? -eq 1 ] || cp "$CHANGED" "$RUNNER_TEMP/changed-device.txt"
          if has -E '^android/(app|domain|data|marketdata)/src/|^android/testdata/uitest/|^\.github/workflows/android-device-tests\.yml$' "$RUNNER_TEMP/changed-device.txt"; then
            CONNECTED=true
          fi
          if has -E '^android/(app|domain|data)/src/main/java/(.+/)?data/(local|portfolio)/|^android/app/schemas/|^\.github/workflows/android-device-tests\.yml$' "$CHANGED"; then
            MIGRATION=true
          fi
          if has -xE 'android/app/proguard-rules\.pro|android/app/build\.gradle\.kts|android/domain/build\.gradle\.kts|android/data/build\.gradle\.kts|android/gradle/libs\.versions\.toml|android/marketdata/(consumer|proguard)-rules\.pro|\.github/scripts/android_smoke_test\.sh|\.github/workflows/android-device-tests\.yml' "$CHANGED"; then
            RELEASE=true
          fi
          echo "connected tests: $CONNECTED · migration tests: $MIGRATION · release smoke: $RELEASE"
          echo "connected=$CONNECTED" >> "$GITHUB_OUTPUT"
          echo "migration=$MIGRATION" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"

  connected-tests:
    # Pull requests: only when «changes» found sources that the device tests cover (see header). «changes» is
    # skipped outside pull requests, hence !cancelled(); if it fails, its output is empty and this job is skipped.
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.connected == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same toolchain as android.yml: Java 17, Gradle with cache.
      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Hardware acceleration for the x86_64 emulator (see reactivecircus/android-emulator-runner).
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Build the app and test APKs before the emulator starts, so its boot time is not wasted.
      - name: Build debug and test APKs
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle-apks.log" \
            || { bash "$GITHUB_WORKSPACE/.github/scripts/gradle_errors.sh" "$RUNNER_TEMP/gradle-apks.log"; exit 1; }

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: android
          # Generous boot wait for the swiftshader emulator; the tests themselves wait up to 60 s
          # per step (loading all pair lists), so the job limit of 60 min leaves ample room.
          emulator-boot-timeout: 900
          # timeout_msec (AndroidJUnitRunner, per test method): a test that hangs (deadlock, waiting forever) fails
          # after 5 min with TestTimedOutException and is named in the report. It does not cover @Before, rules or an
          # emulator that hangs as a whole: `timeout` stops the Gradle call after 40 min with a clear error, before
          # the job limit (75 min = build + boot + 40) cancels the job without any output.
          script: timeout --kill-after=60 40m ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.timeout_msec=300000 --stacktrace || { rc=$?; [ "$rc" -ne 124 ] || echo "::error title=Device tests::the Gradle call was stopped after 40 min (emulator or a test setup hung)"; exit "$rc"; }

      # Failed tests as annotations (artifacts are not always reachable for reviewers)
      - name: Failed tests
        if: failure()
        run: |
          python3 - <<'PY' || true
          import glob, xml.etree.ElementTree as ET
          n = 0
          for f in glob.glob('app/build/outputs/androidTest-results/connected/**/*.xml', recursive=True):
              for tc in ET.parse(f).getroot().iter('testcase'):
                  # Assumption = intended skip (e.g. ScreenshotTourTest outside screenshots.yml), not a failure
                  if tc.find('skipped') is not None or 'AssumptionViolatedException' in ET.tostring(tc, encoding='unicode'):
                      continue
                  for fail in list(tc.findall('failure')) + list(tc.findall('error')):
                      msg = (fail.get('message') or fail.text or '').strip().splitlines()
                      body = ' | '.join(l.strip() for l in (fail.text or '').strip().splitlines()[:6])
                      print(f"::error::{tc.get('classname')}.{tc.get('name')}: {body[:900]}")
                      n += 1
          print(f"failed tests: {n}")
          PY

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: device-test-reports
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14

  # ICU-dependent device tests also on API 26 (minSdk): the system ICU there is much older than on API 34, and both
  # grapheme counting (TextLimit) and the month/year pattern (MonthYearFormat) come from it. Only these two classes,
  # so the extra emulator stays cheap.
  connected-tests-api26:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build debug and test APKs
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle-apks.log" \
            || { bash "$GITHUB_WORKSPACE/.github/scripts/gradle_errors.sh" "$RUNNER_TEMP/gradle-apks.log"; exit 1; }

      - name: Run TextLimit and MonthYearFormat device tests (API 26)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 26
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: android
          emulator-boot-timeout: 900
          # Two small classes: per-test limit as in connected-tests, the whole Gradle call stopped after 15 min
          script: timeout --kill-after=60 15m ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.cryptochecker.app.TextLimitDeviceTest,com.cryptochecker.app.MonthYearFormatIcuTest -Pandroid.testInstrumentationRunnerArguments.timeout_msec=300000 --stacktrace || { rc=$?; [ "$rc" -ne 124 ] || echo "::error title=Device tests API 26::the Gradle call was stopped after 15 min (emulator hung?)"; exit "$rc"; }

      - name: Failed tests
        if: failure()
        run: |
          python3 - <<'PY' || true
          import glob, xml.etree.ElementTree as ET
          n = 0
          for f in glob.glob('app/build/outputs/androidTest-results/connected/**/*.xml', recursive=True):
              for tc in ET.parse(f).getroot().iter('testcase'):
                  # Assumption = intended skip (e.g. ScreenshotTourTest outside screenshots.yml), not a failure
                  if tc.find('skipped') is not None or 'AssumptionViolatedException' in ET.tostring(tc, encoding='unicode'):
                      continue
                  for fail in list(tc.findall('failure')) + list(tc.findall('error')):
                      body = ' | '.join(l.strip() for l in (fail.text or '').strip().splitlines()[:6])
                      print(f"::error::API 26 {tc.get('classname')}.{tc.get('name')}: {body[:900]}")
                      n += 1
          print(f"failed tests: {n}")
          PY

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: device-test-reports-api26
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14

  # Pull requests that change only the Room schemas (app/schemas; database sources start connected-tests, which runs
  # these classes too): the migration and encryption
  # device tests (RoomSchemaMigrationTest, every DatabaseFreshInstall* and DatabaseEncryption* class; also when this workflow changes) on API 34, before
  # the merge instead of only on main. The class list comes from the androidTest sources (package + file name).
  migration-tests:
    needs: changes
    # Not next to connected-tests: that job runs every class, these included
    if: needs.changes.outputs.migration == 'true' && needs.changes.outputs.connected != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Fully qualified class names for -Pandroid.testInstrumentationRunnerArguments.class (no wildcards there);
      # RoomSchemaMigrationTest and DatabaseFreshInstallTest must exist, otherwise the job is red.
      - name: Migration test classes
        run: |
          set -euo pipefail
          CLASSES=""
          while IFS= read -r f; do
            PKG=$(sed -n 's/^package \([A-Za-z0-9_.]*\).*/\1/p' "$f" | head -n 1)
            CLASSES="${CLASSES:+$CLASSES,}${PKG:+$PKG.}$(basename "$f" .kt)"
          done < <(find app/src/androidTest -type f \( -name 'RoomSchemaMigrationTest.kt' -o -name 'DatabaseFreshInstall*.kt' \
            -o -name 'DatabaseEncryption*.kt' \) | sort)
          for required in RoomSchemaMigrationTest DatabaseFreshInstallTest; do
            grep -qE "(^|\.)$required\$" <<< "${CLASSES//,/$'\n'}" \
              || { echo "::error title=Migration tests::$required not found in app/src/androidTest"; exit 1; }
          done
          echo "Migration test classes: $CLASSES"
          echo "MIGRATION_CLASSES=$CLASSES" >> "$GITHUB_ENV"

      - name: Build debug and test APKs
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle-apks.log" \
            || { bash "$GITHUB_WORKSPACE/.github/scripts/gradle_errors.sh" "$RUNNER_TEMP/gradle-apks.log"; exit 1; }

      - name: Run migration and encryption device tests (API 34)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: android
          emulator-boot-timeout: 900
          # One Gradle call per class (run_device_classes.sh): with the whole list only the first class ran; all
          # calls together stopped after 25 min (emulator hung?)
          script: timeout --kill-after=60 25m bash "$GITHUB_WORKSPACE/.github/scripts/run_device_classes.sh" "$MIGRATION_CLASSES" || { rc=$?; [ "$rc" -ne 124 ] || echo "::error title=Migration tests::the Gradle calls were stopped after 25 min (emulator hung?)"; exit "$rc"; }

      # Green only with proof from the result XML: every listed class has an executed test, and every @Test of
      # RoomSchemaMigrationTest ran and passed (builds 166-168 were green here while the same test failed on main).
      - name: Required migration tests ran
        run: |
          python3 - <<'PY'
          import glob, os, re, sys, xml.etree.ElementTree as ET
          ran = {}
          files = glob.glob('app/build/device-class-results/**/*.xml', recursive=True)
          # Fundort und Inhalt sichtbar machen (die Job-Logs sind nicht immer zugänglich)
          print(f"::notice title=Migration tests::result XML files: {files or 'none'}")
          for f in files:
              cases = list(ET.parse(f).getroot().iter('testcase'))
              names = sorted({tc.get('classname') for tc in cases})
              print(f"::notice title=Migration tests::{f}: {len(cases)} test cases in {names}")
              for tc in cases:
                  bad = any(tc.find(t) is not None for t in ('failure', 'error', 'skipped'))
                  ran.setdefault(tc.get('classname'), {})[tc.get('name')] = not bad
          missing = [c for c in os.environ['MIGRATION_CLASSES'].split(',') if not any(ran.get(c, {}).values())]
          src = open('app/src/androidTest/java/com/cryptochecker/app/RoomSchemaMigrationTest.kt', encoding='utf-8').read()
          methods = re.findall(r'@Test\s+fun\s+(\w+)', src)
          schema = ran.get('com.cryptochecker.app.RoomSchemaMigrationTest', {})
          missing += [f'RoomSchemaMigrationTest.{m}' for m in methods or ['<no @Test found>'] if not schema.get(m)]
          for m in missing:
              print(f"::error title=Migration tests::{m} did not run or did not pass (result XML)")
          print(f"result XML: {sum(len(v) for v in ran.values())} tests in {len(ran)} classes; missing: {len(missing)}")
          sys.exit(1 if missing else 0)
          PY

      - name: Failed tests
        if: failure()
        run: |
          python3 - <<'PY' || true
          import glob, xml.etree.ElementTree as ET
          n = 0
          for f in glob.glob('app/build/device-class-results/**/*.xml', recursive=True):
              for tc in ET.parse(f).getroot().iter('testcase'):
                  # Assumption = intended skip (e.g. ScreenshotTourTest outside screenshots.yml), not a failure
                  if tc.find('skipped') is not None or 'AssumptionViolatedException' in ET.tostring(tc, encoding='unicode'):
                      continue
                  for fail in list(tc.findall('failure')) + list(tc.findall('error')):
                      body = ' | '.join(l.strip() for l in (fail.text or '').strip().splitlines()[:6])
                      print(f"::error::Migration {tc.get('classname')}.{tc.get('name')}: {body[:900]}")
                      n += 1
          print(f"failed tests: {n}")
          PY

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: device-test-reports-migration
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            android/app/build/device-class-results/
          if-no-files-found: ignore
          retention-days: 14

  # The instrumented tests above use the debug build; R8 (shrinking, obfuscation, missing keep
  # rules) only shows in the release build. This job installs exactly that build on an emulator.
  # Pull requests: only when «changes» reports one of the release-build files listed in the header.
  release-smoke:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.release == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # 26 = minSdk, 34 = same image as connected-tests
        api-level: [26, 34]
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build release APK (R8, unsigned)
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace

      # Throwaway key, valid for one day and never stored: only so the emulator accepts the APK.
      # zipalign before apksigner (signing must come last); -P 16 needs build-tools 35+.
      - name: Sign release APK with a throwaway key
        run: |
          set -euo pipefail
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          UNSIGNED=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | sort | head -n 1)
          test -n "$UNSIGNED" || { echo "::error::No release APK in app/build/outputs/apk/release"; exit 1; }
          KS="$RUNNER_TEMP/smoke.jks"
          keytool -genkeypair -noprompt -keystore "$KS" -storepass smokepass -keypass smokepass \
            -alias smoke -keyalg RSA -keysize 2048 -validity 1 -dname "CN=CI smoke test"
          ALIGNED="$RUNNER_TEMP/release-aligned.apk"
          if [ "$(basename "$BT" | cut -d. -f1)" -ge 35 ] 2>/dev/null; then
            "$BT/zipalign" -f -P 16 4 "$UNSIGNED" "$ALIGNED"
          else
            "$BT/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          fi
          "$BT/apksigner" sign --ks "$KS" --ks-pass pass:smokepass --key-pass pass:smokepass \
            --out "$RUNNER_TEMP/release-smoke.apk" "$ALIGNED"
          "$BT/apksigner" verify "$RUNNER_TEMP/release-smoke.apk"
          rm -f "$KS"

      # Emulator boot problems are environmental: the step may fail without failing the job; the
      # results step then warns «no results». App crashes are judged there, not here.
      - name: Release smoke test on emulator (API ${{ matrix.api-level }})
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: android
          emulator-boot-timeout: 900
          # The script never fails the step itself; the next step turns its findings into annotations.
          script: bash "$GITHUB_WORKSPACE/.github/scripts/android_smoke_test.sh" "$RUNNER_TEMP/release-smoke.apk" ${{ matrix.api-level }} "$RUNNER_TEMP/smoke-findings.tsv" "$RUNNER_TEMP/smoke-logs"

      # Crash -> error (job fails); ANR -> warning; success -> notice with the start time.
      - name: Smoke test results
        if: always()
        run: |
          F="$RUNNER_TEMP/smoke-findings.tsv"
          if [ ! -s "$F" ]; then
            # On main and release tags (release state, including refs/tags/v*) a smoke test without
            # results fails the job; on branches a warning
            if [ "$GITHUB_REF" = "refs/heads/main" ] || [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error title=Release smoke test API ${{ matrix.api-level }}::No smoke test results (emulator did not start or the script did not run)"
              exit 1
            fi
            echo "::warning title=Release smoke test API ${{ matrix.api-level }}::No smoke test results (emulator did not start or the script did not run)"
            exit 0
          fi
          python3 -I "$GITHUB_WORKSPACE/.github/scripts/annotate.py" "$F" "Release smoke test API ${{ matrix.api-level }}"

      - name: Upload smoke test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-smoke-logs-api${{ matrix.api-level }}
          path: ${{ runner.temp }}/smoke-logs/
          if-no-files-found: ignore
          retention-days: 14

  # Required check «Android device tests» (ruleset «protect-main»): green when every job that should run for this
  # event passed and the jobs «changes» did not pick were skipped; red for a failed, hung (time limit) or never
  # started job. On pull requests: changes, then connected-tests, migration-tests and release-smoke as picked; on
  # every other event connected-tests, the API 26 tests and release-smoke.
  collect:
    name: Android device tests
    needs: [changes, connected-tests, connected-tests-api26, migration-tests, release-smoke]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Result of the device-test jobs
        env:
          PR: ${{ github.event_name == 'pull_request' }}
          CHANGES: ${{ needs.changes.result }}
          CONNECTED: ${{ needs.connected-tests.result }}
          API26: ${{ needs.connected-tests-api26.result }}
          MIGRATION: ${{ needs.migration-tests.result }}
          RELEASE: ${{ needs.release-smoke.result }}
          PICK_CONNECTED: ${{ needs.changes.outputs.connected }}
          PICK_MIGRATION: ${{ needs.changes.outputs.migration }}
          PICK_RELEASE: ${{ needs.changes.outputs.release }}
        run: |
          set -u
          python3 -I .github/scripts/collect_jobs.py --self-test
          may() { [ "$1" = true ] && echo "" || echo ":may-skip"; }
          if [ "$PR" = true ]; then
            if [ "$PICK_MIGRATION" = true ] && [ "$PICK_CONNECTED" != true ]; then RUN_MIGRATION=true; else RUN_MIGRATION=false; fi
            python3 -I .github/scripts/collect_jobs.py "Android device tests" "changes=$CHANGES" \
              "connected tests=$CONNECTED$(may "$PICK_CONNECTED")" "migration tests=$MIGRATION$(may "$RUN_MIGRATION")" \
              "release smoke=$RELEASE$(may "$PICK_RELEASE")" "API 26 tests=$API26:may-skip"
          else
            python3 -I .github/scripts/collect_jobs.py "Android device tests" "changes=$CHANGES:may-skip" \
              "connected tests=$CONNECTED" "API 26 tests=$API26" "release smoke=$RELEASE" "migration tests=$MIGRATION:may-skip"
          fi
