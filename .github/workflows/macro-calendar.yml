# Updates docs/macro/events.json (US economic release dates for the app's
# "Wirtschaftsdaten" hint) from the official BLS, Federal Reserve and BEA pages.
# Served by GitHub Pages at https://r1adbe.github.io/cryptoChecker/macro/events.json
# Health check: a source failing on 2+ consecutive runs (counters in docs/macro/status.json) or an
# event type without dates newer than 14 days opens/updates ONE issue "Macro calendar check failed"
# (closed again once healthy). The run stays green for that; red only if a script or the artifact check fails.
# Signed: the apps accept events.json only if its SHA-256 is in the signed mirror manifest (entry macro_events.json,
# written by market-data.yml from the committed file); after a commit this workflow starts «Market data» so the
# manifest follows within minutes (until then the apps keep their cache or the built-in calendar).
name: Macro calendar

on:
  schedule:
    - cron: '17 5 * * 1'   # Mondays 05:17 UTC
  workflow_dispatch:

# Least privilege (two jobs): «fetch» reads the third-party pages without any write permission and
# hands its result over as an artifact; «publish» (write permissions, no third-party requests) checks out github.sha
# afresh, downloads and strictly checks the artifact (artifact_check.py), then manages the issue and commits.
permissions: {}

concurrency:
  group: macro-calendar
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-24.04
    permissions:
      contents: read    # checkout only
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Third-party web pages; no write token exists in this job
      - name: Build events.json
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 .github/scripts/macro_calendar.py --output docs/macro/events.json --skip-health
          mkdir -p "$RUNNER_TEMP/macro"
          cp docs/macro/events.json docs/macro/status.json "$RUNNER_TEMP/macro/"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macro-calendar
          path: ${{ runner.temp }}/macro
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: fetch
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # commit and push docs/macro
      pages: write      # request a Pages build
      issues: write     # health-check issue (macro_calendar.py)
      actions: write    # download the artifact of this run (gh run download); start «Market data» after a commit
    timeout-minutes: 10
    steps:
      # Fresh checkout of the tested commit; the token is not stored in .git/config
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # gh (preinstalled) downloads this run's artifact
      - name: Download artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name macro-calendar --dir "$RUNNER_TEMP/macro"

      # Only events.json and status.json, size and rough schema; nothing from the artifact is executed
      - name: Check artifact
        run: |
          python3 -I .github/scripts/artifact_check.py --dir "$RUNNER_TEMP/macro" --profile macro
          cp "$RUNNER_TEMP/macro/events.json" "$RUNNER_TEMP/macro/status.json" docs/macro/

      # Downloads nothing: reads events.json and status.json, opens/closes the issue
      - name: Health check
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 .github/scripts/macro_calendar.py --output docs/macro/events.json --health-only

      - name: Commit if changed
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain -- docs/macro)" ]; then
            echo "No changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Public commit identity: GitHub noreply address only, never a private email.
          git config user.name 'r1AD'
          git config user.email '68864596+r1adBE@users.noreply.github.com'
          # events.json and the failure counters status.json (health check)
          git add -A docs/macro
          git commit -m "Update macro calendar ($(date -u +%Y-%m-%d))"
          # checkout ran with persist-credentials: false, so pass the token for this step only
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          GIT_AUTH=(-c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH")
          for i in 1 2 3; do
            if git "${GIT_AUTH[@]}" push origin HEAD:"$GITHUB_REF_NAME"; then break; fi
            git "${GIT_AUTH[@]}" pull --rebase origin "$GITHUB_REF_NAME"
            if [ "$i" = 3 ]; then exit 1; fi
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Request Pages build
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" --silent || echo "Pages build request skipped."

      # New hash into the signed manifest (market-data.yml checks out main and signs docs/macro/events.json)
      - name: Renew mirror manifest
        if: steps.commit.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run market-data.yml --repo "$GITHUB_REPOSITORY" --ref main \
            || echo "::warning::Market data not started; the manifest follows with its next hourly run"
