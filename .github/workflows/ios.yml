# Builds the iOS app (ios/) without code signing (Release for devices with the release checks), runs the
# unit tests (target CryptoCheckerTests, incl. the shared Android/iOS cases in Tests/Parity)
# and the UI tests of the main flows (target CryptoCheckerUITests: add a coin, price alarm,
# CSV import, backup — app started with -uiTesting: empty storage, fake exchange answers).
# Gate: line coverage of the unit tests (notice with total and logic = Shared/ without views; logic below
# MIN_LOGIC is red).
# Runs on every pull request, on pushes to main when ios/ changes, and by hand
# (Actions -> iOS -> Run workflow); macOS runners are slow, so Android-only changes skip it.
# Signing, archiving and uploading happen locally in Xcode.
name: iOS

on:
  push:
    branches: [main]
    # Release tags (v<versionName>-<versionCode>) always run the full gate; GitHub does not
    # evaluate the paths filter for tag pushes, so every workflow runs for the tagged commit
    tags: ['v*']
    paths:
      - 'ios/**'
      - 'android/testdata/parity/**'
      - 'android/testdata/uitest/**'
      - '.github/workflows/ios.yml'
      - '.github/scripts/xcode_errors.sh'
      - '.github/scripts/ios_release_audit.py'
      - '.github/scripts/annotate.py'
      - '.github/scripts/xccov_summary.py'
      - 'android/app/build.gradle.kts'
  # Pull requests always run this workflow (no paths filter): its job is a required check, and a required check
  # whose workflow is skipped by a paths filter would wait forever («Expected»).
  pull_request:
  workflow_dispatch:
    inputs:
      thread_sanitizer:
        description: 'Run the unit tests with Thread Sanitizer (manual check for data races, slower)'
        type: boolean
        default: false

concurrency:
  group: ios-${{ github.ref }}
  # Pull requests: a newer push replaces the run; main keeps every run so each commit gets a result
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Three Macs in parallel (release build, unit tests, UI tests) instead of one after another; the job «iOS build»
  # at the end collects their results under the name of the required check.
  release:
    name: iOS release build
    # Since 28 April 2026 App Store uploads must be built with Xcode 26 / the iOS 26 SDK,
    # so CI builds with the same toolchain.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26'

      - name: Xcode version
        run: |
          xcodebuild -version
          xcodebuild -version | head -n1 | grep -qE '^Xcode 26(\.|$)' || { echo "::error::Xcode 26 required"; exit 1; }

      # Release build settings of app and widget as annotations (ios_release_audit.py settings):
      # error for DEBUG conditions, testability or a version different from Android; warning for
      # optimisation level, VALIDATE_PRODUCT and dSYM.
      - name: Release build settings audit
        working-directory: ios
        run: |
          F="$RUNNER_TEMP/ios-settings-findings.tsv"
          : > "$F"
          xcodebuild -showBuildSettings -json \
            -project CryptoChecker.xcodeproj \
            -scheme CryptoChecker \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            > "$RUNNER_TEMP/release-settings.json" 2> "$RUNNER_TEMP/release-settings.err" || true
          python3 -I "$GITHUB_WORKSPACE/.github/scripts/ios_release_audit.py" settings \
            "$RUNNER_TEMP/release-settings.json" "$GITHUB_WORKSPACE/android/app/build.gradle.kts" "$F"
          python3 -I "$GITHUB_WORKSPACE/.github/scripts/annotate.py" "$F" "iOS release settings"

      # The archive is built for devices, not the Simulator: same Release build for
      # generic/platform=iOS, unsigned. Compile errors fail the step; a failure with only signing
      # errors (no team/profile on the runner) is a warning, not an app error.
      - name: Build Release for device (no signing)
        working-directory: ios
        run: |
          LOG="$RUNNER_TEMP/xcode-build-device.log"
          F="$RUNNER_TEMP/ios-device-findings.tsv"
          : > "$F"
          set +e
          xcodebuild build \
            -project CryptoChecker.xcodeproj \
            -scheme CryptoChecker \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedDataDevice" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            GIT_COMMIT="$GITHUB_SHA" \
            > "$LOG" 2>&1
          status=$?
          set -e
          tail -n 40 "$LOG"
          python3 -I "$GITHUB_WORKSPACE/.github/scripts/ios_release_audit.py" build-log "$LOG" "$status" "$F"
          python3 -I "$GITHUB_WORKSPACE/.github/scripts/annotate.py" "$F" "iOS device Release build"

      # The built Release app: Info.plist (version = Android, background tasks, export compliance),
      # privacy manifests in app and widget, no UI test hooks or XCTest in the binaries, compiler
      # warnings (count + first 8; ceiling 0) from the device Release build.
      - name: Inspect Release app
        working-directory: ios
        run: |
          F="$RUNNER_TEMP/ios-app-findings.tsv"
          : > "$F"
          APP="$RUNNER_TEMP/DerivedDataDevice/Build/Products/Release-iphoneos/CryptoChecker.app"
          LOG="$RUNNER_TEMP/xcode-build-device.log"
          python3 -I "$GITHUB_WORKSPACE/.github/scripts/ios_release_audit.py" app "$APP" \
            CryptoCheckerWidgetsExtension "$GITHUB_WORKSPACE/android/app/build.gradle.kts" \
            "$GITHUB_WORKSPACE/ios" "$LOG" "$F"
          python3 -I "$GITHUB_WORKSPACE/.github/scripts/annotate.py" "$F" "iOS Release app"

      - name: Upload Xcode logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xcode-logs-release
          path: |
            ${{ runner.temp }}/xcode-build-device.log
          if-no-files-found: ignore
          retention-days: 14

  unit:
    name: iOS unit tests
    # Since 28 April 2026 App Store uploads must be built with Xcode 26 / the iOS 26 SDK,
    # so CI builds with the same toolchain.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26'

      - name: Xcode version
        run: |
          xcodebuild -version
          xcodebuild -version | head -n1 | grep -qE '^Xcode 26(\.|$)' || { echo "::error::Xcode 26 required"; exit 1; }

      # The whole log goes to a file (it used to be «| tail -n 200», which cut off the error
      # lines). Compiler errors are printed at the end and turned into annotations, so they
      # show on the run page even without signing in.
      - name: Build for iOS Simulator (no signing)
        working-directory: ios
        run: |
          LOG="$RUNNER_TEMP/xcode-build.log"
          set +e
          xcodebuild build \
            -project CryptoChecker.xcodeproj \
            -scheme CryptoChecker \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            > "$LOG" 2>&1
          status=$?
          set -e
          tail -n 60 "$LOG"
          bash "$GITHUB_WORKSPACE/.github/scripts/xcode_errors.sh" "$LOG"
          exit $status

      # Simulator for the tests: "iPhone 17" if the installed Xcode has it, otherwise its
      # first available iPhone.
      - name: Pick iOS Simulator
        run: |
          DEVICE="iPhone 17"
          if ! xcrun simctl list devices available | grep -q "$DEVICE ("; then
            DEVICE=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [^()]+' | sed 's/ *$//')
          fi
          echo "Simulator: $DEVICE"
          echo "SIM_DEVICE=$DEVICE" >> "$GITHUB_ENV"

      # Unit tests in the Simulator (target CryptoCheckerTests, hosted by the app). The same run records the line
      # coverage (-enableCodeCoverage, result bundle UnitTests.xcresult); the step «Coverage (logic gate)» reads it.
      # With Thread Sanitizer the performance tests (time limits) are skipped: TSAN slows everything down several
      # times, so their limits would fail without a real regression. xcodebuild hands every environment variable
      # with the prefix TEST_RUNNER_ to the test process without the prefix, so the tests see CC_SKIP_PERFORMANCE=1.
      - name: Unit tests (iOS Simulator)
        working-directory: ios
        env:
          TSAN: ${{ inputs.thread_sanitizer && 'YES' || 'NO' }}
        run: |
          LOG="$RUNNER_TEMP/xcode-test.log"
          echo "Thread Sanitizer: $TSAN"
          if [ "$TSAN" = YES ]; then
            export TEST_RUNNER_CC_SKIP_PERFORMANCE=1
            echo "Performance tests skipped (CC_SKIP_PERFORMANCE=1)"
          fi
          set +e
          xcodebuild test \
            -enableThreadSanitizer "$TSAN" \
            -enableCodeCoverage YES \
            -project CryptoChecker.xcodeproj \
            -scheme CryptoChecker \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=$SIM_DEVICE" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/UnitTests.xcresult" \
            -only-testing:CryptoCheckerTests \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            > "$LOG" 2>&1
          status=$?
          set -e
          tail -n 120 "$LOG"
          bash "$GITHUB_WORKSPACE/.github/scripts/xcode_errors.sh" "$LOG"
          # Skipped tests (XCTSkip) are listed as warnings. Critical classes must not be skipped on main and release
          # tags (error there): SharedStorageTests (test keychain), WatchlistLockBehaviorTests and
          # BackgroundRefreshRunTests. The last two run on the test app's sealed watchlist; without a keychain
          # entitlement (unsigned CI host) they use an in-memory test keychain (Tests/HostStorageKey.swift), so a
          # missing or unwritable watchlist is a test failure, not a skip. Their only remaining skips are quiet hours
          # of the test app and «not enough time left» for the extra-data alarms; those two are allowed below.
          SKIPPED=$(grep -oE "Test [Cc]ase '[^']+' skipped" "$LOG" | sed -E "s/^Test [Cc]ase '(.*)' skipped$/\1/" | sort -u || true)
          # Environment-dependent skips (quiet hours of the test app, «not enough time left» on a slow runner) do not
          # count as critical: they are reported, but the run stays green
          ALLOWED=$(grep -oE "\-\[[A-Za-z0-9_.]+ [A-Za-z0-9_]+\] : Test skipped - (Nachtruhe|Restzeit)" "$LOG" | sed -E 's/ : Test skipped.*$//' | sort -u || true)
          COUNT=$(printf '%s\n' "$SKIPPED" | grep -c . || true)
          echo "Skipped unit tests: $COUNT"
          CRITICAL=0
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            echo "::warning title=Skipped iOS unit test::$name"
            if [ -n "$ALLOWED" ] && printf '%s\n' "$ALLOWED" | grep -qxF -- "$name"; then
              echo "::notice title=Allowed skip::$name (environment)"
              continue
            fi
            case "$name" in
              *SharedStorageTests*|*WatchlistLockBehaviorTests*|*BackgroundRefreshRunTests*) CRITICAL=$((CRITICAL + 1)) ;;
            esac
          done <<< "$SKIPPED"
          if [ "$CRITICAL" -gt 0 ] && { [ "$GITHUB_REF" = "refs/heads/main" ] || [[ "$GITHUB_REF" == refs/tags/v* ]]; }; then
            echo "::error title=Skipped critical iOS tests::$CRITICAL critical test(s) (SharedStorage, WatchlistLockBehavior, BackgroundRefreshRun) skipped on $GITHUB_REF"
            [ "$status" -ne 0 ] || status=1
          fi
          exit $status

      # Line coverage of the unit-test run above as ONE notice: total and «logic» (files under Shared/ without SwiftUI
      # views). Gate: «logic» must not fall below MIN_LOGIC (just under the measured value: stops regressions without
      # forcing new work; raise it when coverage grows). Only after green unit tests; a missing report is red.
      # Thread Sanitizer run (manual): display only, no gate - the skipped performance tests also cover logic, so the
      # number is not comparable with MIN_LOGIC; the regular runs (without TSAN) keep the gate.
      - name: Coverage (logic gate)
        timeout-minutes: 5
        env:
          MIN_LOGIC: '78'
          TSAN: ${{ inputs.thread_sanitizer && 'YES' || 'NO' }}
        run: |
          python3 -I "$GITHUB_WORKSPACE/.github/scripts/xccov_summary.py" --self-test
          xcrun xccov view --report --json "$RUNNER_TEMP/UnitTests.xcresult" > "$RUNNER_TEMP/xccov.json" || true
          if [ "$TSAN" = YES ]; then
            echo "::notice title=iOS coverage gate::Thread Sanitizer run: coverage shown only, gate not applied"
            python3 -I "$GITHUB_WORKSPACE/.github/scripts/xccov_summary.py" "$RUNNER_TEMP/xccov.json"
          else
            python3 -I "$GITHUB_WORKSPACE/.github/scripts/xccov_summary.py" --min-logic "$MIN_LOGIC" \
              "$RUNNER_TEMP/xccov.json"
          fi

      - name: Upload Xcode logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xcode-logs-unit
          path: |
            ${{ runner.temp }}/xcode-build.log
            ${{ runner.temp }}/xcode-test.log
          if-no-files-found: ignore
          retention-days: 14

  ui:
    name: iOS UI tests
    # Since 28 April 2026 App Store uploads must be built with Xcode 26 / the iOS 26 SDK,
    # so CI builds with the same toolchain.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26'

      - name: Xcode version
        run: |
          xcodebuild -version
          xcodebuild -version | head -n1 | grep -qE '^Xcode 26(\.|$)' || { echo "::error::Xcode 26 required"; exit 1; }

      # Simulator for the tests: "iPhone 17" if the installed Xcode has it, otherwise its
      # first available iPhone.
      - name: Pick iOS Simulator
        run: |
          DEVICE="iPhone 17"
          if ! xcrun simctl list devices available | grep -q "$DEVICE ("; then
            DEVICE=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [^()]+' | sed 's/ *$//')
          fi
          echo "Simulator: $DEVICE"
          echo "SIM_DEVICE=$DEVICE" >> "$GITHUB_ENV"

      # UI tests of the main flows (target CryptoCheckerUITests, XCUITest) in the Simulator.
      # The app runs with -uiTesting (Debug build only): empty storage per launch, fixed exchange
      # answers (no network), test files instead of the document picker. A failed test is retried
      # once (Simulator hiccups); the result bundle (screenshots, logs) is uploaded on failure.
      - name: UI tests (iOS Simulator)
        working-directory: ios
        timeout-minutes: 30
        run: |
          LOG="$RUNNER_TEMP/xcode-uitest.log"
          set +e
          xcodebuild test \
            -project CryptoChecker.xcodeproj \
            -scheme CryptoChecker \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=$SIM_DEVICE" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -only-testing:CryptoCheckerUITests \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure -test-iterations 2 \
            -resultBundlePath "$RUNNER_TEMP/UITests.xcresult" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            > "$LOG" 2>&1
          status=$?
          set -e
          tail -n 120 "$LOG"
          bash "$GITHUB_WORKSPACE/.github/scripts/xcode_errors.sh" "$LOG"
          exit $status

      # Tests that only passed on the retry (-retry-tests-on-failure) as a warning: green, but flaky. Read from the result
      # bundle (xcresulttool, Xcode 16+ format), else from the xcodebuild log (a test case both failed and passed).
      # Purely informative: an unknown format or a missing tool never fails the job.
      - name: Retried UI tests
        if: always()
        continue-on-error: true
        run: |
          python3 -I - "$RUNNER_TEMP/UITests.xcresult" "$RUNNER_TEMP/xcode-uitest.log" <<'PY' || true
          import json, os, re, subprocess, sys
          bundle, log = sys.argv[1], sys.argv[2]
          retried, source = {}, None

          def walk(node):
              if not isinstance(node, dict):
                  return
              kids = node.get("children") or []
              if node.get("nodeType") == "Test Case":
                  runs = [k for k in kids if isinstance(k, dict) and k.get("nodeType") in ("Repetition", "Test Case Run")]
                  if len(runs) > 1:
                      retried[node.get("nodeIdentifier") or node.get("name") or "?"] = node.get("result") or "?"
              for k in kids:
                  walk(k)

          if os.path.isdir(bundle):
              try:
                  out = subprocess.run(["xcrun", "xcresulttool", "get", "test-results", "tests", "--path", bundle],
                                       capture_output=True, text=True, timeout=120)
                  if out.returncode == 0:
                      data = json.loads(out.stdout)
                      for n in data.get("testNodes") or []:
                          walk(n)
                      source = "xcresult"
              except Exception as e:  # format or tool differs: fall back to the log
                  print(f"xcresulttool not usable: {e}")
          if source is None and os.path.isfile(log):
              seen = {}
              pattern = re.compile(r"Test [Cc]ase '([^']+)' (passed|failed)")
              with open(log, encoding="utf-8", errors="replace") as f:
                  for line in f:
                      m = pattern.search(line)
                      if m:
                          seen.setdefault(m.group(1), []).append(m.group(2))
              for name, results in seen.items():
                  if "failed" in results and len(results) > 1:
                      retried[name] = results[-1]
              source = "log"
          for name, result in sorted(retried.items()):
              print(f"::warning title=Retried UI test::{name} needed a retry (final result: {result}; source: {source})")
          print(f"retried UI tests: {len(retried)} (source: {source or 'none'})")
          PY

      - name: Upload Xcode logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xcode-logs-ui
          path: |
            ${{ runner.temp }}/xcode-uitest.log
            ${{ runner.temp }}/UITests.xcresult
          if-no-files-found: ignore
          retention-days: 14

  # Required check (ruleset «protect-main»): green only if all three iOS jobs are green
  build:
    name: iOS build
    needs: [release, unit, ui]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Result of the iOS jobs
        env:
          RELEASE: ${{ needs.release.result }}
          UNIT: ${{ needs.unit.result }}
          UI: ${{ needs.ui.result }}
        run: |
          echo "release build: $RELEASE, unit tests: $UNIT, UI tests: $UI"
          [ "$RELEASE" = success ] && [ "$UNIT" = success ] && [ "$UI" = success ] || {
            echo "::error title=iOS::release build $RELEASE, unit tests $UNIT, UI tests $UI"
            exit 1
          }
