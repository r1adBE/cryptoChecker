# Nach dem Store-Start: keine laufenden Versions-Updates mehr (stabiler Unterbau, nur Börsen werden noch angepasst).
# `open-pull-requests-limit: 0` schaltet die Versions-Pull-Requests ab; Sicherheits-Updates kommen weiterhin,
# solange «Dependabot security updates» unter Settings › Code security eingeschaltet ist.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
