# After the store launch: no more routine Gradle version updates (stable foundation, only exchanges still get adjusted).
# `open-pull-requests-limit: 0` turns off the version pull requests there; security updates still arrive
# as long as «Dependabot security updates» is enabled under Settings › Code security.
# GitHub Actions: monthly version pull requests, at most two open at a time.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
